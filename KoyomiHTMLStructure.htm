<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栽培こよみ構造エディタ（完全版）</title>
    <style>
        /* =========================================
           エディタ専用スタイル
           ========================================= */
        :root {
            --editor-bg: #f8f9fa;
            --sidebar-color: #2d5016;
            --accent-color: #4caf50;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Meiryo, sans-serif;
            display: flex; height: 100vh;
            overflow: hidden; background: var(--editor-bg);
        }

        /* レイアウト */
        #editor-container {
            width: 480px; height: 100%;
            border-right: 1px solid #ccc;
            display: flex; flex-direction: column;
            background: white; box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        #preview-container {
            flex: 1; height: 100%;
            overflow-y: auto; padding: 20px;
            background: #eee;
            scroll-behavior: smooth;
        }

        /* ツールバー */
        .toolbar {
            padding: 10px 15px;
            background: var(--sidebar-color);
            color: white;
            display: flex; justify-content: space-between; align-items: center;
        }

        .toolbar h2 { margin: 0; font-size: 1rem; }

        .scroll-area { flex: 1; overflow-y: auto; padding: 15px; }

        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block; font-weight: bold; font-size: 0.85rem;
            margin-bottom: 5px; color: #333;
        }

        input[type="text"], textarea {
            width: 100%; padding: 8px;
            border: 1px solid #ccc; border-radius: 4px;
            box-sizing: border-box; font-size: 14px;
        }

        .card {
            border: 1px solid #ddd; padding: 12px;
            margin-bottom: 10px; border-radius: 6px;
            background: #fdfdfd; position: relative;
        }

        /* ボタン類 */
        button {
            padding: 6px 12px; cursor: pointer;
            border-radius: 4px; border: none;
            font-weight: bold; transition: 0.2s;
        }

        .btn-add { background: var(--accent-color); color: white; }
        .btn-del { background: #e91e63; color: white; padding: 4px 8px; font-size: 0.75rem; }
        .btn-export { background: #2196f3; color: white; }
        button:hover { opacity: 0.8; }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--sidebar-color);
            padding-bottom: 5px; margin: 20px 0 10px 0;
        }

        /* =========================================
           プレビュー用スタイル (こよみ表示用)
           ========================================= */
        .koyomi-preview {
            background: white; padding: 40px;
            max-width: 850px; margin: 0 auto;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            color: #333; line-height: 1.6;
        }

        .koyomi-preview h1 { text-align: center; color: var(--sidebar-color); margin-bottom: 5px; }
        .koyomi-preview .subtitle { text-align: center; color: #666; margin-bottom: 20px; }
        
        .koyomi-preview table {
            width: 100%; border-collapse: collapse; margin-bottom: 25px;
            table-layout: fixed;
        }

        .koyomi-preview th {
            background: var(--sidebar-color); color: white;
            padding: 10px; border: 1px solid #1a3a0d;
        }

        .koyomi-preview td {
            padding: 10px; border: 1px solid #ddd; text-align: center;
        }

        .koyomi-preview .detail-box {
            background: #f0f8ff; border: 2px solid var(--sidebar-color);
            border-radius: 8px; padding: 20px; margin: 25px 0;
            scroll-margin-top: 20px;
        }

        .koyomi-preview .detail-box h3 {
            color: var(--sidebar-color); margin: 0 0 10px 0;
            border-bottom: 2px solid var(--sidebar-color);
            display: flex; justify-content: space-between; align-items: center;
        }

        .koyomi-preview .clickable-item {
            cursor: pointer; text-decoration: underline;
            color: #2e7d32; font-weight: bold;
        }

        .koyomi-preview .back-button {
            padding: 2px 8px; background: #666; color: white;
            font-size: 0.75rem; border-radius: 4px;
        }

        .btn-calc {
            display: inline-block; margin-top: 10px;
            padding: 8px 16px; border-radius: 6px;
            text-decoration: none; font-weight: bold;
            border: 2px solid;
        }
        .btn-calc-herbicide { border-color: #0369a1; color: #0369a1; }
        .btn-calc-insecticide { border-color: #15803d; color: #15803d; }

    </style>
</head>
<body>

    <div id="editor-container">
        <div class="toolbar">
            <h2>栽培こよみエディタ</h2>
            <div style="display: flex; gap: 5px;">
                <button onclick="saveAsJSON()" style="background: #4a5568; color: white; font-size: 0.7rem;">💾 保存</button>
                <label style="background: #718096; color: white; font-size: 0.7rem; padding: 6px 10px; border-radius: 4px; cursor: pointer; display: flex; align-items: center;">
                    📂 読込 <input type="file" accept=".json" onchange="loadFromJSON(event)" style="display:none;">
                </label>
                <button class="btn-export" onclick="exportHTML()" style="font-size: 0.7rem;">HTML出力</button>
            </div>
        </div>
        
        <div class="scroll-area">
            <div class="form-group">
                <label>タイトル</label>
                <input type="text" id="title" oninput="koyomiData.title=this.value;renderPreview()" placeholder="例：栽培こよみ">
            </div>
            <div class="form-group">
                <label>サブタイトル</label>
                <input type="text" id="subtitle" oninput="koyomiData.subtitle=this.value;renderPreview()" placeholder="例：WCS用">
            </div>

            <div class="section-header">
                <h3 style="font-size: 0.9rem; margin:0;">🗓️ スケジュール</h3>
                <button class="btn-add" onclick="addRow()" style="font-size: 0.7rem;">+ 行追加</button>
            </div>
            <div id="schedule-rows"></div>

            <div class="section-header">
                <h3 style="font-size: 0.9rem; margin:0;">📖 詳細ボックス</h3>
                <button class="btn-add" onclick="addDetail()" style="font-size: 0.7rem;">+ 追加</button>
            </div>
            <div id="detail-list"></div>
        </div>
    </div>

    <div id="preview-container">
        <div id="live-preview" class="koyomi-preview">
            </div>
    </div>
<script>
    // --- データ構造 ---
    let koyomiData = {
        title: "コシヒカリ栽培こよみ",
        subtitle: "WCS（ホールクロップサイレージ）用",
        rows: [
            { month: "3月", deco: "中旬", stage: "育苗", task: "種子消毒・浸種" }
        ],
        details: [
            { id: "d1", title: "育苗", items: "・温度管理を徹底する", pesticideType: "none" }
        ]
    };

    const iconMap = {
        '土づくり': '🌱', '育苗': '🌱', '播種': '🫘', '田植': '🌱', 
        '除草': '☘️', '施薬': '💊', '中干し': '🌊', '収穫': '✂️', '出穂': '🌾'
    };

    // --- 初期化 ---
    function init() {
        renderEditor();
        renderPreview();
    }

    // --- エディタ描画 ---
    function renderEditor() {
        document.getElementById('title').value = koyomiData.title;
        document.getElementById('subtitle').value = koyomiData.subtitle;

        // スケジュール行
        const rowArea = document.getElementById('schedule-rows');
        rowArea.innerHTML = '';
        koyomiData.rows.forEach((row, i) => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-bottom:5px;">
                    <input type="text" value="${row.month}" oninput="koyomiData.rows[${i}].month=this.value;renderPreview()" placeholder="月">
                    <input type="text" value="${row.deco}" oninput="koyomiData.rows[${i}].deco=this.value;renderPreview()" placeholder="旬">
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                    <input type="text" value="${row.stage}" oninput="koyomiData.rows[${i}].stage=this.value;renderPreview()" placeholder="ステージ">
                    <input type="text" value="${row.task}" oninput="koyomiData.rows[${i}].task=this.value;renderPreview()" placeholder="作業">
                </div>
                <button class="btn-del" onclick="removeRow(${i})" style="margin-top:5px;">削除</button>`;
            rowArea.appendChild(div);
        });

        // 詳細ボックス
        const detArea = document.getElementById('detail-list');
        detArea.innerHTML = '';
        koyomiData.details.forEach((det, i) => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <input type="text" value="${det.title}" oninput="koyomiData.details[${i}].title=this.value;renderPreview()" style="font-weight:bold; margin-bottom:5px;">
                <textarea oninput="koyomiData.details[${i}].items=this.value;renderPreview()">${det.items}</textarea>
                <div style="display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.75rem;">
                    <span>農薬:</span>
                    <label><input type="radio" name="pest_${i}" value="none" ${det.pesticideType==='none'?'checked':''} onchange="koyomiData.details[${i}].pesticideType='none';renderPreview()"> なし</label>
                    <label><input type="radio" name="pest_${i}" value="herbicide" ${det.pesticideType==='herbicide'?'checked':''} onchange="koyomiData.details[${i}].pesticideType='herbicide';renderPreview()"> 除草剤</label>
                    <label><input type="radio" name="pest_${i}" value="insecticide" ${det.pesticideType==='insecticide'?'checked':''} onchange="koyomiData.details[${i}].pesticideType='insecticide';renderPreview()"> 殺虫剤</label>
                    <button class="btn-del" onclick="removeDetail(${i})" style="margin-left:auto; padding:2px 5px;">削除</button>
                </div>`;
            detArea.appendChild(div);
        });
    }

    function addRow() { koyomiData.rows.push({month:"", deco:"", stage:"", task:""}); renderEditor(); renderPreview(); }
    function removeRow(i) { if(confirm("この行を削除しますか？")){ koyomiData.rows.splice(i,1); renderEditor(); renderPreview(); } }
    function addDetail() { koyomiData.details.push({id:"d"+Date.now(), title:"新しい項目", items:"", pesticideType:"none"}); renderEditor(); renderPreview(); }
    function removeDetail(i) { if(confirm("このボックスを削除しますか？")){ koyomiData.details.splice(i,1); renderEditor(); renderPreview(); } }

    // --- プレビュー描画 ---
    function renderPreview() {
        const container = document.getElementById('live-preview');
        
        let tableHtml = `<table><thead><tr><th style="width:15%">月</th><th style="width:15%">旬</th><th style="width:35%">ステージ</th><th style="width:35%">作業</th></tr></thead><tbody>`;
        koyomiData.rows.forEach(r => {
            tableHtml += `<tr><td><strong>${r.month}</strong></td><td>${r.deco}</td><td>${linkify(r.stage)}</td><td>${linkify(r.task)}</td></tr>`;
        });
        tableHtml += `</tbody></table>`;

        let detsHtml = koyomiData.details.map(d => `
            <div id="${d.id}" class="detail-box">
                <h3>
                    <span>${d.title}</span> 
                    <button class="back-button" onclick="document.getElementById('preview-container').scrollTo({top:0, behavior:'smooth'})">↑ 戻る</button>
                </h3>
                <ul>${d.items.split('\n').filter(t=>t.trim()).map(t=>`<li>${t}</li>`).join('')}</ul>
                <div style="text-align:right;">
                    ${d.pesticideType==='herbicide'?'<button onclick="openVirtualTab(herbicideData)" class="btn-calc btn-calc-herbicide">🧮 除草剤計算</button>':''}
                    ${d.pesticideType==='insecticide'?'<button onclick="openVirtualTab(insecticideData)" class="btn-calc btn-calc-insecticide">🧮 殺虫剤計算</button>':''}
                </div>
            </div>`).join('');

        container.innerHTML = `
            <h1>${koyomiData.title}</h1>
            <p class="subtitle">${koyomiData.subtitle}</p>
            <hr>
            <h2>栽培スケジュール</h2>
            ${tableHtml}
            <hr>
            <h2>詳細情報</h2>
            ${detsHtml}`;
    }

    // アイコン & リンク処理
    function linkify(text) {
        if (!text) return "";
        let html = text;
        Object.keys(iconMap).forEach(key => {
            if (html.includes(key) && !html.includes(iconMap[key])) html = html.split(key).join(iconMap[key] + " " + key);
        });
        koyomiData.details.forEach(det => {
            const keyword = det.title.replace(/[^\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/g, '').trim();
            if (keyword && html.includes(keyword)) {
                html = html.replace(new RegExp(keyword, 'g'), `<span class="clickable-item" onclick="const el=document.getElementById('${det.id}'); document.getElementById('preview-container').scrollTo({top: el.offsetTop - 20, behavior:'smooth'})">${keyword}</span>`);
            }
        });
        return html;
    }

    // --- JSON & HTML出力 ---
    function saveAsJSON() {
        const blob = new Blob([JSON.stringify(koyomiData, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `koyomi_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
    }

    function loadFromJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                koyomiData = JSON.parse(e.target.result);
                renderEditor(); renderPreview();
            } catch (err) { alert("無効なファイルです"); }
        };
        reader.readAsText(file);
    }

    function exportHTML() {
        const content = document.getElementById('live-preview').innerHTML;
        const head = document.head.innerHTML;
        const fullHtml = `<!DOCTYPE html><html><head>${head}</head><body><div class="koyomi-preview">${content}</div></body></html>`;
        const blob = new Blob([fullHtml], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "koyomi_export.html";
        a.click();
    }

    function openVirtualTab(data) {
        const newWin = window.open("", "_blank");
        if (newWin) { newWin.document.write(data); newWin.document.close(); }
    }

    // 農薬ツール（前回内容を維持）
    const herbicideData = `<!DOCTYPE html><html><body style="font-family:sans-serif;padding:20px;"><h2>除草剤希釈計算</h2></body></html>`;
    const insecticideData = `<!DOCTYPE html><html><body style="font-family:sans-serif;padding:20px;"><h2>殺虫剤希釈計算</h2></body></html>`;

    init();
</script>
    </body>
</html>
