<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栽培こよみエディタ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"></script>

    <style>
        :root {
            --primary-green: #2e7d32;
            --bg-color: #f8f9fa;
            --border-color: #ddd;
        }
        body { font-family: sans-serif; margin: 0; background: var(--bg-color); height: 100vh; overflow: hidden; }
        
        /* レイアウト */
        .editor-layout { display: flex; height: 100vh; padding: 10px; box-sizing: border-box; gap: 10px; }
        .editor-pane, .preview-pane { flex: 1; display: flex; flex-direction: column; background: white; border-radius: 8px; border: 1px solid var(--border-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* ツールバー */
        .toolbar { padding: 10px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #f1f3f1; }
        button { cursor: pointer; padding: 6px 12px; border: 1px solid var(--primary-green); background: white; color: var(--primary-green); border-radius: 4px; font-weight: bold; transition: 0.2s; }
        button:hover { background: var(--primary-green); color: white; }
        button.secondary { border-color: #666; color: #666; font-size: 0.8rem; }

        /* エディタエリア */
        .textarea-container { flex: 1; position: relative; }
        #markdown-input { width: 100%; height: 100%; border: none; padding: 15px; box-sizing: border-box; resize: none; font-family: monospace; font-size: 14px; outline: none; }
        
        /* プレビューエリア */
        .preview-area { flex: 1; overflow-y: auto; padding: 20px; background: white; }
        #html-display-area { width: 100%; height: 100%; margin: 0; padding: 15px; background: #222; color: #eee; font-size: 13px; overflow: auto; white-space: pre-wrap; word-break: break-all; }

        /* こよみデザイン（プレビューおよび出力用） */
        .container { max-width: 900px; margin: auto; color: #333; }
        .main-header { border-bottom: 3px solid var(--primary-green); margin-bottom: 25px; padding-bottom: 15px; }
        .main-title { font-size: 26px; font-weight: bold; color: var(--primary-green); margin: 0; }
        .subtitle { font-size: 18px; color: #444; margin-top: 8px; font-weight: bold; }
        .date-info { text-align: right; font-size: 0.9rem; color: #666; margin-top: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #e8f5e9; color: var(--primary-green); }
        .table-wrapper { overflow-x: auto; }
        .detail-box { border-left: 5px solid var(--primary-green); background: #f9fdf9; padding: 15px; margin-bottom: 15px; border-radius: 0 4px 4px 0; }
        .back-button { font-size: 11px; padding: 2px 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; margin-left: 10px; }
        .stage-box { padding: 2px 6px; background: #e8f5e9; border-radius: 4px; font-weight: bold; color: #2e7d32; }
        .clickable-item { cursor: pointer; text-decoration: underline; }

        /* ドラッグ&ドロップ */
        .drop-zone { position: absolute; inset: 0; background: rgba(46, 125, 50, 0.1); border: 3px dashed var(--primary-green); display: none; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
        .file-info { padding: 5px 15px; background: #e8f5e9; font-size: 0.8rem; display: none; }
        .file-info.show { display: block; }
    </style>
</head>
<body>

<div class="editor-layout">
    <div class="editor-pane">
        <div class="toolbar">
            <span style="font-weight:bold; color:#2d5016;">📝 Markdown入力</span>
            <div>
                <button class="secondary" onclick="insertTemplate()">テンプレート挿入</button>
                <button class="secondary" onclick="clearEditor()">クリア</button>
            </div>
        </div>
        <div class="textarea-container" id="textarea-container">
            <textarea id="markdown-input" placeholder="ダブルクリックでファイル選択、またはドラッグ＆ドロップ..."></textarea>
            <div class="drop-zone" id="drop-zone">
                <div class="drop-zone-content" style="text-align:center;">
                    <div style="font-size:30px;">📤</div>
                    <div style="font-weight:bold;">ドロップして読み込み</div>
                </div>
            </div>
        </div>
        <div class="file-info" id="file-info">✅ <strong><span id="file-name"></span></strong> を読み込みました</div>
        <div style="margin:5px 15px; font-size:0.8rem; color:#666;">
            文字数: <span id="char-count">0</span> | 行: <span id="char-info">0</span>
        </div>
    </div>

    <div class="preview-pane">
        <div class="toolbar">
            <span style="font-weight:bold; color:#2d5016;">👁️ プレビュー</span>
            <div>
                <button id="toggle-btn" onclick="toggleDisplayMode(this)">📄 HTML表示に切り替え</button>
                <button onclick="execCopyHTML()">📋 コピー</button>
                <button onclick="downloadHTML()">💾 保存</button>
            </div>
        </div>
        <div class="preview-area">
            <div id="preview" class="container"></div>
            <pre id="html-display-area" style="display:none;"></pre>
        </div>
    </div>
</div>

<input type="file" id="file-input" style="display:none;" accept=".md,.txt,.markdown">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script>
    const input = document.getElementById('markdown-input');
    const preview = document.getElementById('preview');
    const htmlDisplayArea = document.getElementById('html-display-area');
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    let isHtmlMode = false;

    const iconMap = {
        '播種': '🌱', '発芽': '🌱', '定植': '🌱', '育苗': '🌱', '施薬': '💊', 'ほ場準備': '🚜', '耕うん': '🚜', '畝立て': '🚜', '田植': '🌱', '葉期': '🍃', '出穂': '🌾', '開花': '🌷', '基肥': '🧪', '追肥': '🧪', '収穫': '✂️', '出荷': '📦'
    };
    const sortedKeys = Object.keys(iconMap).sort((a, b) => b.length - a.length);

    // --- メイン: プレビュー更新 ---
    window.updatePreview = function() {
        const markdown = input.value;
        if (!markdown.trim()) { preview.innerHTML = ''; return; }

        const lines = markdown.split('\n').filter(l => l.trim() !== '');
        let titleText = lines[0]?.replace(/^#+\s*/, '').trim() || "栽培こよみ";
        let subtitleText = "";
        if (lines.length > 1 && !lines[1].includes('最終更新') && !lines[1].startsWith('---')) {
            subtitleText = lines[1].replace(/\*\*/g, '').replace(/^#+\s*/, '').trim();
        }

        const dateStr = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '年') + '日';

        // MarkdownをHTMLに変換
        let contentHtml = marked.parse(markdown);
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = contentHtml;

        // タイトル重複削除（最初のh1, h2など）
        const firstH = tempDiv.querySelector('h1, h2');
        if (firstH) firstH.remove();
        const firstP = tempDiv.querySelector('p');
        if (firstP && (firstP.textContent.includes(subtitleText) || firstP.textContent.includes('最終更新'))) firstP.remove();

        // 詳細セクション化 & 表アイコン化
        const sections = [];
        tempDiv.querySelectorAll('h3').forEach(h3 => {
            const rawTitle = h3.textContent;
            const id = 'ref_' + Math.random().toString(36).substr(2, 9);
            const cleanKey = rawTitle.replace(/[^\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/g, '').trim();
            h3.innerHTML = `<span>${rawTitle}</span><button class="back-button" onclick="backToTable()">← 戻る</button>`;
            h3.style.display = 'flex'; h3.style.justifyContent = 'space-between'; h3.style.alignItems = 'center';
            sections.push({ key: cleanKey, id: id });
            
            const box = document.createElement('div');
            box.className = 'detail-box'; box.id = id;
            h3.parentNode.insertBefore(box, h3);
            box.appendChild(h3);
            let next = box.nextSibling;
            while(next && next.tagName !== 'H3' && !next.classList?.contains('detail-box')) {
                let temp = next.nextSibling; box.appendChild(next); next = temp;
            }
        });

        tempDiv.querySelectorAll('td').forEach(td => {
            let txt = td.innerHTML;
            sortedKeys.forEach(key => {
                if (txt.includes(key)) {
                    const target = sections.find(s => s.key.includes(key) || key.includes(s.key));
                    const icon = iconMap[key];
                    txt = txt.split(key).join(target ? `<span class="stage-box clickable-item" onclick="scrollToDetail('${target.id}')">${icon} ${key}</span>` : `${icon} ${key}`);
                }
            });
            td.innerHTML = txt;
        });

        const finalBodyHtml = tempDiv.innerHTML.replace(/<table>/g, '<div class="table-wrapper"><table>').replace(/<\/table>/g, '</table></div>');

        // --- 完全なHTMLドキュメントの生成 ---
        const fullDoc = `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${titleText}</title>
    <style>${document.querySelector('style').innerHTML}.container{padding:20px;}</style>
</head>
<body>
    <div class="container">
        <header class="main-header">
            <h1 class="main-title">🌾 ${titleText}</h1>
            ${subtitleText ? `<div class="subtitle">${subtitleText}</div>` : ''}
            <div class="date-info">最終更新: ${dateStr}</div>
        </header>
        <div class="content-body">${finalBodyHtml}</div>
    </div>
    <script>
        function scrollToDetail(id){ const el=document.getElementById(id); if(el){ el.scrollIntoView({behavior:'smooth'}); el.classList.add('highlight-flash'); setTimeout(()=>el.classList.remove('highlight-flash'),2000); } }
        function backToTable(){ window.scrollTo({top:0,behavior:'smooth'}); }
    <\/script>
</body>
</html>`;

        // プレビューとコードエリアに反映
        const sanitizedPreview = DOMPurify.sanitize(fullDoc.split('<body>')[1].split('</body>')[0], { ADD_ATTR: ['onclick'], ADD_TAGS: ['header'] });
        preview.innerHTML = sanitizedPreview;
        htmlDisplayArea.textContent = fullDoc;
        document.getElementById('char-count').textContent = markdown.length;
        document.getElementById('char-info').textContent = markdown.split('\n').length;
    };

    // --- ボタン操作 ---
    window.toggleDisplayMode = function(btn) {
        isHtmlMode = !isHtmlMode;
        preview.style.display = isHtmlMode ? 'none' : 'block';
        htmlDisplayArea.style.display = isHtmlMode ? 'block' : 'none';
        btn.textContent = isHtmlMode ? '👁️ プレビュー表示に戻す' : '📄 HTML表示に切り替え';
    };

    window.execCopyHTML = function() {
        navigator.clipboard.writeText(htmlDisplayArea.textContent).then(() => alert("✅ HTML全体をコピーしました！"));
    };

    window.downloadHTML = function() {
        const blob = new Blob([htmlDisplayArea.textContent], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "栽培こよみ.html";
        a.click();
    };

    window.insertTemplate = function() {
        input.value = `# 飼料用トウモロコシ栽培こよみ\n**WCS（ホールクロップサイレージ）用**\n\n## 📊 栽培スケジュール\n\n| 月 | 旬 | 生育ステージ | 主な作業 |\n|:---:|:---:|:---:|:---|\n| 4月 | 上旬 | 播種 | ほ場準備 |\n\n---\n\n### ほ場準備\n- 丁寧に耕起する\n\n### 播種\n- 適温でまく`;
        updatePreview();
    };

window.clearEditor = function() {
    if(confirm("消去しますか？")) {
        // 1. 入力エリアを空にする
        input.value = "";
        
        // 2. ファイル情報を非表示にする
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');
        
        fileInfo.classList.remove('show'); // 緑色のバーを隠す
        fileName.textContent = "";         // ファイル名を消す
        
        // 3. プレビューを更新する
        updatePreview();
    }
};
    window.scrollToDetail = (id) => document.getElementById(id)?.scrollIntoView({behavior:'smooth'});
    window.backToTable = () => window.scrollTo({top:0, behavior:'smooth'});

    // --- ファイル操作 ---
    document.getElementById('textarea-container').addEventListener('dblclick', () => fileInput.click());
    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (re) => { 
            input.value = re.target.result; 
            document.getElementById('file-name').textContent = file.name;
            document.getElementById('file-info').classList.add('show');
            updatePreview(); 
        };
        reader.readAsText(file);
    };

    input.addEventListener('input', updatePreview);
</script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;

        }
.container {

}

}

            margin-top: 30px;

        h3 {

        }

            transition: all 0.3s ease;
        }

.table-wrapper {
    position: relative;
    overflow-x: auto;
    border: 1px solid #ddd;
    border-radius: 5px;
    margin-bottom: 20px;
    display: inline-block;    /* これを追加すると、枠線もテーブルのサイズに縮まります */

}
/* 表自体を親要素の幅100%に広げる */
table {

/* 各列の幅を黄金比に近い形で割り振り */

th:nth-child(4), td:nth-child(4) { width: 30%; } /* 主な作業 */
        thead {
            background: #2d5016;

            top: 0;
            z-index: 10;
        }
        th {
            background: #2d5016;
            color: white;

        }
/* 1. 親要素：アイコンたちを綺麗に整列させる */

    flex-wrap: wrap;       /* 幅が足りない時だけ改行する */

		    background: #ffe0b2;

/* 2. アイコン自体：横幅を揃えて「ちぐはぐ」を直す */
.work-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    
    /* ポイント：幅を固定（または最小幅を指定）することで形を揃える */

/* ボディセル：スマホ向けのコンパクト設定 */
.detail-table td {
    padding: 8px 6px; /* 余白を詰める */
    border: 1px solid #ddd;
    background-color: white;
    /* 幅をこれまでの半分（150px → 75px）程度に設定 */
    min-width: 75px; 
    line-height: 1.4;
    word-break: break-all; /* 枠内で強制改行 */
}

/* 1列目（項目名）をさらに細くしてバランスを取る */
.detail-table td:first-child {
    min-width: 60px;
    font-weight: bold;
}

/* 縞々設定 */
.detail-table tbody tr:nth-child(odd) td {
    background-color: #f9f9f9 !important;
}

/* ホバー設定 */
.detail-table tbody tr:hover td {
    background-color: #f0f8ff !important;
}

/* --- PC（画面幅が広い時）の設定：ここで広さを戻す --- */

    .detail-table {
        font-size: 0.95rem;

    .detail-table th {
        padding: 12px 10px;
        font-size: 1rem;
    }
    .detail-table td {
        padding: 12px;
        min-width: auto; /* PCでは中身に合わせる */
        font-size: 0.95rem;
    }
}

    /* ========== エディタレイアウト ========== */
    .editor-layout { display: flex; gap: 20px; width: 100%; min-height: 95vh; }
    .editor-pane, .preview-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    
    .textarea-container {
        position: relative;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }

    textarea {
        width: 100%;
        flex-grow: 1;
        padding: 15px;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        border: 2px solid #ddd;
        border-radius: 8px;
        resize: none;
        background: white;
        color: #333;
        transition: all 0.3s;
    }

    textarea:hover {
        border-color: #2d5016;
        background-color: #fafafa;
    }

    textarea:focus {
        outline: none;
        border-color: #2d5016;
        background-color: #f0f8ff;
    }

    /* ========== ドラッグドロップオーバーレイ（GitHub風） ========== */
    .drop-zone {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(45, 80, 22, 0.05);
        border: 2px dashed #2d5016;
        border-radius: 8px;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 100;
        backdrop-filter: blur(0px);
        transition: all 0.3s;
    }

    .drop-zone.active {
        display: flex;
        background: rgba(45, 80, 22, 0.15);
        border-color: #2d5016;
        backdrop-filter: blur(2px);
    }

    .drop-zone-content {
        text-align: center;
        pointer-events: none;
    }

    .drop-zone-icon {
        font-size: 3rem;
        margin-bottom: 10px;
    }

    .drop-zone-text {
        font-size: 1.1rem;
        font-weight: bold;
        color: #2d5016;
        margin-bottom: 5px;
    }

    .drop-zone-hint {
        font-size: 0.9rem;
        color: #666;
    }

    .preview-area {
        flex-grow: 1;
        overflow-y: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }
    .toolbar {
        padding: 10px 0;
        display: flex;
        gap: 10px;
        justify-content: space-between;

    #preview { margin: 0; background: white; }

    /* ========== HTMLモーダル ========== */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
        background-color: white;
        margin: 5% auto;
        padding: 20px;
        border-radius: 8px;
        width: 80%;
        max-height: 80vh;
        overflow-y: auto;
    }
    .modal-close {
