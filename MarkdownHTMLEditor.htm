    /* ========== エディタレイアウト ========== */
    .editor-layout { display: flex; gap: 20px; width: 100%; min-height: 95vh; }
    .editor-pane, .preview-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    
    .textarea-container {
        position: relative;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }

    textarea {
        width: 100%;
        flex-grow: 1;
        padding: 15px;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        border: 2px solid #ddd;
        border-radius: 8px;
        resize: none;
        background: white;
        color: #333;
        transition: all 0.3s;
    }

    textarea:hover {
        border-color: #2d5016;
        background-color: #fafafa;
    }

    textarea:focus {
        outline: none;
        border-color: #2d5016;
        background-color: #f0f8ff;
    }

    /* ========== ドラッグドロップオーバーレイ（GitHub風） ========== */
    .drop-zone {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(45, 80, 22, 0.05);
        border: 2px dashed #2d5016;
        border-radius: 8px;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 100;
        backdrop-filter: blur(0px);
        transition: all 0.3s;
    }

    .drop-zone.active {
        display: flex;
        background: rgba(45, 80, 22, 0.15);
        border-color: #2d5016;
        backdrop-filter: blur(2px);
    }

    .drop-zone-content {
        text-align: center;
        pointer-events: none;
    }

    .drop-zone-icon {
        font-size: 3rem;
        margin-bottom: 10px;
    }

    .drop-zone-text {
        font-size: 1.1rem;
        font-weight: bold;
        color: #2d5016;
        margin-bottom: 5px;
    }

    .drop-zone-hint {
        font-size: 0.9rem;
        color: #666;
    }

    .preview-area {
        flex-grow: 1;
        overflow-y: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }
    .toolbar {
        padding: 10px 0;
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
    }
    button {
        padding: 10px 20px;
        cursor: pointer;
        background: #2d5016;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        font-size: 1rem;
        transition: background 0.3s;
    }
    button:hover { background: #1a3a0d; }
    button.secondary {
        background: #666;
        font-size: 0.9rem;
        padding: 8px 16px;
    }
    button.secondary:hover { background: #444; }
    #preview { margin: 0; background: white; }

    /* ========== HTMLモーダル ========== */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
        background-color: white;
        margin: 5% auto;
        padding: 20px;
        border-radius: 8px;
        width: 80%;
        max-height: 80vh;
        overflow-y: auto;
    }
    .modal-close {
        position: absolute;
        right: 15px;
        top: 10px;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        color: #999;
    }
    .modal-close:hover { color: #333; }
    #html-display {
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 15px;
        font-family: monospace;
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 60vh;
        overflow-y: auto;
    }

    /* ========== ファイル入力（隠す） ========== */
    #file-input {
        display: none;
    }

    .file-info {
        margin-top: 8px;
        font-size: 0.85rem;
        color: #666;
        padding: 8px 12px;
        background: #e8f5e9;
        border-radius: 4px;
        display: none;
        border-left: 4px solid #2d5016;
    }

    .file-info.show {
        display: block;
    }

    .file-info strong {
        color: #2d5016;
    }
</style>

<body>

<div class="editor-layout">
    <div class="editor-pane">
        <div class="toolbar">
            <span style="font-weight:bold; color:#2d5016;">📝 Markdown入力</span>
            <div>
                <button class="secondary" onclick="insertTemplate()">テンプレート挿入</button>
                <button class="secondary" onclick="clearEditor()">クリア</button>
            </div>
        </div>
        <div class="textarea-container" id="textarea-container">
            <textarea id="markdown-input" placeholder="ファイルをドラッグ＆ドロップ、またはクリックしてファイルを選択、Markdownをペースト..."></textarea>
            <div class="drop-zone" id="drop-zone">
                <div class="drop-zone-content">
                    <div class="drop-zone-icon">📤</div>
                    <div class="drop-zone-text">ファイルをドロップしてください</div>
                    <div class="drop-zone-hint">または、クリックして選択</div>
                </div>
            </div>
        </div>
        <div class="file-info" id="file-info">✅ <strong><span id="file-name"></span></strong> を読み込みました</div>
        <div style="margin-top:5px; font-size:0.8rem; color:#666;">
            文字数: <span id="char-count">0</span> | 行: <span id="char-info">0</span>
        </div>
    </div>

    <div class="preview-pane">
        <div class="toolbar">
            <span style="font-weight:bold; color:#2d5016;">👁️ プレビュー</span>
            <div>
                <button onclick="showHTML()">📄 HTML表示</button>
                <button onclick="execCopyHTML()">📋 コピー</button>
                <button onclick="downloadHTML()">💾 保存</button>
            </div>
        </div>
        <div class="preview-area">
            <div id="preview" class="container"></div>
        </div>
    </div>
</div>

<!-- HTMLモーダル -->
<div id="htmlModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeHTML()">&times;</span>
        <h2>生成されたHTML</h2>
        <div id="html-display"></div>
    </div>
</div>

<!-- ファイル入力（隠し） -->
<input type="file" id="file-input" accept=".md,.txt,.markdown">

<script>
    const input = document.getElementById('markdown-input');
    const preview = document.getElementById('preview');
    const charCount = document.getElementById('char-count');
    const charInfo = document.getElementById('char-info');
    const htmlModal = document.getElementById('htmlModal');
    const htmlDisplay = document.getElementById('html-display');
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const fileInfo = document.getElementById('file-info');
    const fileName = document.getElementById('file-name');
    const textareaContainer = document.getElementById('textarea-container');

    const commonCSS = document.querySelector('style') ? document.querySelector('style').innerHTML : '';

    // ========== 1. アイコン変換辞書 (iconMap) ==========
    const iconMap = {
        '播種': '🌱', '発芽': '🌱', '定植': '🌱', '育苗': '🌱',
        '葉期': '🍃', '展葉': '🌿', '分げつ': '🌿',
        '絹糸': '🌾', '登熟': '🌾', '出穂': '🌾',
        '水熟': '💧', '乳熟': '🥛', '糊熟': '🥛',
        '黄熟': '🟡', '完熟': '✅', '開花': '🌷', '結実': '🥨',
        'ほ場準備': '🌱', '耕うん': '🚜', '畝立て': '🚜',
        '基肥': '🧪', '追肥': '🧪', '施肥': '🧪',
        '鳥獣': '🚫', '獣害': '🚫',
        '害虫': '🐛', '防除': '🐛', '除草': '💧',
        '収穫': '✂️', '剪定': '✂️', '倒伏': '⚠️', '台風': '🌀',
        '見回り': '🔍', '出荷': '📦'
    };

    // ========== 2. 自動アイコン付与関数 ==========
    function applyAutoIcons(htmlString) {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlString;
        const walker = document.createTreeWalker(tempDiv, NodeFilter.SHOW_TEXT, null, false);
        let node;
        while (node = walker.nextNode()) {
            let text = node.nodeValue;
            Object.keys(iconMap).forEach(key => {
                const icon = iconMap[key];
                if (text.includes(key)) {
                    const regex = new RegExp(key, 'g');
                    text = text.replace(regex, `${icon} ${key}`);
                    // アイコンの重複(🌱 🌱 播種など)を防止
                    const cleanup = new RegExp(`${icon}\\s*${icon}`, 'g');
                    text = text.replace(cleanup, icon);
                }
            });
            node.nodeValue = text;
        }
        return tempDiv.innerHTML;
    }

    // ========== 3. 既存の機能 (そのまま維持) ==========
    window.scrollToDetail = (id) => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
    };

    window.backToTable = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) readMarkdownFile(file);
    });

    input.addEventListener('click', (e) => {
        if (input.value.trim() === '') fileInput.click();
    });

    textareaContainer.addEventListener('dragover', (e) => {
        e.preventDefault(); e.stopPropagation();
        dropZone.classList.add('active');
    });

    textareaContainer.addEventListener('dragleave', (e) => {
        e.preventDefault(); e.stopPropagation();
        if (e.target === textareaContainer) dropZone.classList.remove('active');
    });

    textareaContainer.addEventListener('drop', (e) => {
        e.preventDefault(); e.stopPropagation();
        dropZone.classList.remove('active');
        const files = e.dataTransfer.files;
        if (files.length > 0) readMarkdownFile(files[0]);
    });

    function readMarkdownFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            input.value = e.target.result;
            fileName.textContent = file.name;
            fileInfo.classList.add('show');
            updatePreview();
        };
        reader.readAsText(file);
    }

    function showHTML() {
        htmlDisplay.textContent = preview.innerHTML;
        htmlModal.style.display = 'block';
    }

    function closeHTML() { htmlModal.style.display = 'none'; }
    window.onclick = function(event) { if (event.target === htmlModal) closeHTML(); };

    // ========== 4. プレビュー更新 (ここを微調整) ==========
    function updatePreview() {
        let markdown = input.value;
        if (!markdown.trim()) { preview.innerHTML = ''; return; }

        let html = marked.parse(markdown);

        // アイコン付与を実行
        html = applyAutoIcons(html);

        // リンク・詳細・テーブル処理 (元のロジックを維持)
        html = html.replace(/<a\s+href="([^"]+)">([\s\S]*?)<\/a>/g, (match, href, text) => {
            return `<span class="stage-box stage-mark" onclick="scrollToDetail('${href}');">${text}</span>`;
        });

        html = html.replace(/<h3>(.*?)<\/h3>/g, (match, title) => {
            const id = title.replace(/[^a-zA-Z0-9\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/g, '_').toLowerCase();
            return `</div><div class="detail-box" id="${id}"><h4><span>${title}</span><button class="back-button" onclick="backToTable()">← 戻る</button></h4>`;
        });

        html = html.replace(/<table>/g, '<div class="table-wrapper"><table>');
        html = html.replace(/<\/table>/g, '</table></div>');

        const clean = DOMPurify.sanitize(`<div class="content-body">${html}</div>`, {
            ADD_ATTR: ['onclick', 'style', 'rowspan', 'colspan', 'id'],
            ADD_TAGS: ['span', 'div', 'button', 'table', 'tbody', 'thead'],
            FORCE_BODY: true
        });

        preview.innerHTML = clean;
        charCount.textContent = markdown.length;
        charInfo.textContent = markdown.split('\n').length;
    }

    function execCopyHTML() {
        navigator.clipboard.writeText(preview.innerHTML).then(() => alert('✅ HTMLをコピーしました！'));
    }

    function downloadHTML() {
        const content = preview.innerHTML;
        const finalFile = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><style>${commonCSS}</style></head><body><div class="container">${content}</div><script>function scrollToDetail(id){document.getElementById(id).scrollIntoView({behavior:'smooth'});}function backToTable(){window.scrollTo({top:0,behavior:'smooth'});}<\/script></body></html>`;
        const blob = new Blob([finalFile], { type: 'text/html; charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'cultivation_sheet.html';
        a.click();
    }

    function insertTemplate() {
        input.value = `## 📊 栽培スケジュール\n\n| 月 | 旬 | 生育ステージ | 主な作業 |\n|:---:|:---:|:---:|:---|\n| 4月 | 上旬 | 播種 | ほ場準備 |\n| | 中旬 | 発芽 | 除草剤散布 |`;
        updatePreview();
    }

    function clearEditor() { if (confirm("すべて消去しますか？")) { input.value = ""; updatePreview(); } }

    input.addEventListener('input', updatePreview);
    updatePreview();
</script>

</body>
</html>
