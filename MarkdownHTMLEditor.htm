<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栽培こよみエディタ（修正版）</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 10px;
        }
.container {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    border-radius: 8px;
    /* ↓ここを border: none; に書き換えるか、borderの行を消してください */
    border: none; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
    padding: 20px;
}
.container .detail-box {
    background: #f0f8ff;
    border: 2px solid #2d5016; /* ← 中の箱の線だけが残ります */
    border-radius: 8px;
    padding: 20px;
    margin: 20px 0;
    display: block;
}
        h1 {
            text-align: center;
            color: #2d5016;
            margin-bottom: 5px;
            font-size: 2.2rem;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        .date-info {
            text-align: center;
            color: #999;
            margin-bottom: 25px;
            font-size: 1rem;
        }
        h2 {
            color: #2d5016;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.5rem;
            border-bottom: 3px solid #2d5016;
            padding-bottom: 10px;
        }
        h3 {
            color: #2d5016;
            margin-top: 20px;
            margin-bottom: 12px;
            font-size: 1.2rem;
            border-left: 4px solid #2d5016;
            padding-left: 10px;
        }
        .table-content {
            display: block;
            transition: all 0.3s ease;
        }

.table-wrapper {
    position: relative;
    overflow-x: auto;
    border: 1px solid #ddd;
    border-radius: 5px;
    margin-bottom: 20px;
    display: inline-block;    /* これを追加すると、枠線もテーブルのサイズに縮まります */
    max-width: 100%;         /* 画面からはみ出さないように制限 */
}
/* 表自体を親要素の幅100%に広げる */
table {
    width: 100%;
    max-width: 100%; /* はみ出し防止 */
    table-layout: fixed; /* 列の比率を固定してガタつきを防ぐ */
    border-collapse: collapse;
}
/* 各列の幅を黄金比に近い形で割り振り */
th:nth-child(1), td:nth-child(1) { width: 20%; } /* 月 */
th:nth-child(2), td:nth-child(2) { width: 20%; } /* 旬 */
th:nth-child(3), td:nth-child(3) { width: 30%; } /* 生育ステージ */
th:nth-child(4), td:nth-child(4) { width: 30%; } /* 主な作業 */
        thead {
            background: #2d5016;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th {
            background: #2d5016;
            color: white;
            padding: 14px 6px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid #1a3a0d;
        }
        td {
            padding: 14px 6px;
            border: 1px solid #ddd;
            font-size: 1rem;
            text-align: center;
            line-height: 1.4;
        }
        .row-label {
            background: #f0f0f0;
            font-weight: bold;
            color: #333;
            padding: 14px 6px;
            min-width: 100px;
            text-align: left;
            position: sticky;
            left: 0;
            z-index: 5;
            border: 1px solid #ddd;
            font-size: 1rem;
        }
        .stage-content {
            background: #f9f9f9;
            padding: 12px 6px;
            min-height: 50px;
        }
/* 1. 親要素：アイコンたちを綺麗に整列させる */
.work-content {
    flex-wrap: wrap;       /* 幅が足りない時だけ改行する */
    gap: 8px;             /* アイコン同士の隙間を一定にする */
    justify-content: flex-start; /* 左詰めで並べる */
    padding: 8px !important;
}
        .stage-item {
            display: block;
            padding: 8px 8px;
            margin: 3px auto;
            border-radius: 3px;
            font-size: 0.95rem;
            font-weight: 500;
        }
		.stage-1 {
		    background: #ffe0b2;
		    color: #333;
		    cursor: pointer;
		}
		.stage-1:hover {
		    background: #ffb74d;
		    color: #333;
		}
		.stage-2 {
		    background: #c8e6c9;
		    color: #333;
		    cursor: pointer;
		}
        .stage-3 {
            background: #a5d6a7;
            color: #333;
            cursor: pointer;
        }
        .stage-3:hover {
            background: #7fbf73;
            color: white;
        }
        .stage-4 {
            background: #81c784;
            color: white;
            cursor: pointer;
        }
        .stage-5 {
            background: #66bb6a;
            color: white;
        }
        .stage-6 {
            background: #81d4fa;
            color: #333;
        }
        .stage-7 {
            background: #ffab91;
            color: #333;
            cursor: pointer;
        }
        .stage-7:hover {
            background: #ff8a65;
        }
        .stage-8 {
            background: #fffde7;
            color: #333;
            cursor: pointer;
        }
        .stage-8:hover {
            background: #fffbbd;
        }
        .stage-9 {
            background: #ffd54f;
            color: #333;
            cursor: pointer;
        }
        .stage-9:hover {
            background: #ffca28;
        }
        .stage-10 {
            background: #ffc107;
            color: #333;
            font-weight: bold;
            cursor: pointer;
        }
        .stage-10:hover {
            background: #ffb300;
        }
        .stage-11 {
            background: #8b7355;
            color: white;
            cursor: pointer;
        }
        .stage-11:hover {
            background: #6d5844;
        }
        .split-cell {
            display: flex;
            gap: 2px;
        }
        .split-item {
            flex: 1;
            padding: 10px 2px;
            border-radius: 3px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }
/* 2. アイコン自体：横幅を揃えて「ちぐはぐ」を直す */
.work-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    
    /* ポイント：幅を固定（または最小幅を指定）することで形を揃える */
    width: 70px;           /* 全てのアイコンを同じ幅に */
    height: auto;
    min-height: 65px;      /* 高さも揃えるときれい */
    
    gap: 3px;
    padding: 6px 4px;      /* 左右のパディングを少し削る */
    background: white;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 0.75rem;    /* 文字を少し小さくして収まりを良くする */
    font-weight: 500;
    color: #333;
    cursor: pointer;
    transition: all 0.2s;
    box-sizing: border-box; /* 枠線を含めた幅計算にする */
}
        .work-icon:hover {
            background: #fff3cd;
            border-color: #2d5016;
            transform: scale(1.05);
        }
/* アイコン内の記号/絵文字のサイズ固定 */
.work-icon-symbol {
    font-size: 1.2rem;
    line-height: 1;
}
        .detail-section {
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }
        .detail-box {
            background: #f0f8ff;
            border: 2px solid #2d5016;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            display: block;
            scroll-margin-top: 20px;
            position: relative;
            z-index: 1;
        }
        .detail-box.hidden {
            display: none;
        }
        .detail-box h4 {
            color: #2d5016;
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 2px solid #2d5016;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .detail-box ul {
            margin-left: 20px;
            line-height: 2;
            font-size: 1.05rem;
            color: #333;
            list-style-type: disc;
        }
        .detail-box li {
            margin-bottom: 10px;
        }
.detail-table {
    width: 100%;
    table-layout: auto; 
    border-collapse: collapse;
    margin: 15px 0;
    font-size: 0.85rem; /* スマホでは少し小さく */
    border: 1px solid #ddd;
    background-color: white !important;
}

/* ヘッダー */
.detail-table thead {
    background: #2d5016;
    position: sticky;
    top: 0;
    z-index: 10;
}

.detail-table th {
    background: #2d5016;
    color: white;
    /* パディングを絞って幅を節約 */
    padding: 8px 4px;
    white-space: nowrap;
    border: 1px solid #1a3a0d;
    font-size: 0.85rem;
}

/* ボディセル：スマホ向けのコンパクト設定 */
.detail-table td {
    padding: 8px 6px; /* 余白を詰める */
    border: 1px solid #ddd;
    background-color: white;
    /* 幅をこれまでの半分（150px → 75px）程度に設定 */
    min-width: 75px; 
    line-height: 1.4;
    word-break: break-all; /* 枠内で強制改行 */
}

/* 1列目（項目名）をさらに細くしてバランスを取る */
.detail-table td:first-child {
    min-width: 60px;
    font-weight: bold;
}

/* 縞々設定 */
.detail-table tbody tr:nth-child(odd) td {
    background-color: #f9f9f9 !important;
}

/* ホバー設定 */
.detail-table tbody tr:hover td {
    background-color: #f0f8ff !important;
}

/* --- PC（画面幅が広い時）の設定：ここで広さを戻す --- */
@media (min-width: 768px) {
    .detail-table {
        font-size: 0.95rem;
    }
    .detail-table th {
        padding: 12px 10px;
        font-size: 1rem;
    }
    .detail-table td {
        padding: 12px;
        min-width: auto; /* PCでは中身に合わせる */
        font-size: 0.95rem;
    }
}
        .detail-table tbody tr:nth-child(odd) {
            background: #f9f9f9;
        }
        .detail-table tbody tr:hover {
            background: #f0f8ff;
        }
        .maturity-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }
        .maturity-table thead {
            background: #2d5016;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .maturity-table th {
            background: #2d5016;
            color: white;
            padding: 14px;
            border: 1px solid #1a3a0d;
            font-weight: bold;
            text-align: center;
            font-size: 1.1rem;
        }
        .maturity-table td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: left;
            line-height: 1.8;
            font-size: 1rem;
        }
        .maturity-table tbody tr:nth-child(odd) {
            background: #f9f9f9;
        }
        .maturity-table tbody tr:nth-child(even) {
            background: #f0f8ff;
        }
        .maturity-table tbody tr:hover {
            background: #e8f4f8;
        }
        .back-button {
            display: inline-block;
            padding: 10px 18px;
            background: #666;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin: 0;
            transition: background 0.3s;
        }
        .back-button:hover {
            background: #444;
        }
        strong {
            font-weight: bold;
            font-size: 1.05rem;
        }
        @media (max-width: 768px) {
            html {
                font-size: 14px;
            }

            }

            }

        }
        @media (max-width: 480px) {
            html {
                font-size: 13px;
            }
            .container {

            }

            }

                font-size: 1.15rem;
            }

            }

            }

                font-size: 0.75rem;
                min-height: 50px;
            }
            .legend-item {
                font-size: 0.85rem;
            }
        }
        
    .calc-link-button {
    display: inline-block;
    padding: 8px 15px;
    background-color: #fff;
    color: #2e7d32;
    text-decoration: none;
    border: 2px solid #2e7d32;

    background-color: #2e7d32;

    /* ========== エディタレイアウト ========== */
    .editor-layout { display: flex; gap: 20px; width: 100%; min-height: 95vh; }
    .editor-pane, .preview-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    
    .textarea-container {
        position: relative;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }

    textarea {
        width: 100%;
        flex-grow: 1;
        padding: 15px;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        border: 2px solid #ddd;
        border-radius: 8px;
        resize: none;
        background: white;
        color: #333;
        transition: all 0.3s;
    }

    textarea:hover {
        border-color: #2d5016;
        background-color: #fafafa;
    }

    textarea:focus {
        outline: none;
        border-color: #2d5016;
        background-color: #f0f8ff;
    }

    /* ========== ドラッグドロップオーバーレイ（GitHub風） ========== */
    .drop-zone {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(45, 80, 22, 0.05);
        border: 2px dashed #2d5016;
        border-radius: 8px;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 100;
        backdrop-filter: blur(0px);
        transition: all 0.3s;
    }

    .drop-zone.active {
        display: flex;
        background: rgba(45, 80, 22, 0.15);
        border-color: #2d5016;
        backdrop-filter: blur(2px);
    }

    .drop-zone-content {
        text-align: center;
        pointer-events: none;
    }

    .drop-zone-icon {
        font-size: 3rem;
        margin-bottom: 10px;
    }

    .drop-zone-text {
        font-size: 1.1rem;
        font-weight: bold;
        color: #2d5016;
        margin-bottom: 5px;
    }

    .drop-zone-hint {
        font-size: 0.9rem;
        color: #666;
    }

    .preview-area {
        flex-grow: 1;
        overflow-y: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }
    .toolbar {
        padding: 10px 0;
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
    }
    button {
        padding: 10px 20px;
        cursor: pointer;
        background: #2d5016;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        font-size: 1rem;
        transition: background 0.3s;
    }
    button:hover { background: #1a3a0d; }
    button.secondary {
        background: #666;
        font-size: 0.9rem;
        padding: 8px 16px;
    }
    button.secondary:hover { background: #444; }
    #preview { margin: 0; background: white; }

    /* ========== HTMLモーダル ========== */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
        background-color: white;
        margin: 5% auto;
        padding: 20px;
        border-radius: 8px;
        width: 80%;
        max-height: 80vh;
        overflow-y: auto;
    }
    .modal-close {
        position: absolute;
        right: 15px;
        top: 10px;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        color: #999;
    }
    .modal-close:hover { color: #333; }
    #html-display {
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 15px;
        font-family: monospace;
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 60vh;
        overflow-y: auto;
    }

    /* ========== ファイル入力（隠す） ========== */
    #file-input {
        display: none;
    }

    .file-info {
        margin-top: 8px;
        font-size: 0.85rem;
        color: #666;
        padding: 8px 12px;
        background: #e8f5e9;
        border-radius: 4px;
        display: none;
        border-left: 4px solid #2d5016;
    }

    .file-info.show {
        display: block;
    }

    .file-info strong {
        color: #2d5016;
    }

    /* ========== 1. 表示エリア（プレビュー・HTMLソース） ========== */
    #html-display-area {
        display: none;
        white-space: pre-wrap;
        word-break: break-all;
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        background: #2d2d2d;
        color: #ccc;
        padding: 20px;
        border-radius: 8px;
        height: 100%;
        overflow-y: auto;
        border: 1px solid #444;
        line-height: 1.5;
    }

    /* トグルボタンの強調状態 */
    .active-toggle {
        background-color: #ff9800 !important;
        color: white !important;
    }

    /* ========== 2. インタラクティブ要素（ホバー・アニメーション） ========== */
    .clickable-item {
        cursor: pointer;
        transition: all 0.2s;
    }

    .clickable-item:hover {
        background-color: #e3f2fd;
        border: 1px solid #2196f3;
    }

    /* ハイライト点滅アニメーション */
    .highlight-flash {
        animation: flash-bg 2s ease-out;
    }

    @keyframes flash-bg {
        0% { background-color: #fff9c4; }
        100% { background-color: transparent; }
    }

    /* ========== 3. モーダルウィンドウ（HTML書き出し用） ========== */
    #htmlModal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background: white;
        padding: 30px;
        border-radius: 12px;
        width: 80%;
        max-width: 900px;
        position: relative;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    /* 閉じる「×」ボタン */
    .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 28px;
        font-weight: bold;
        color: #666;
        cursor: pointer;
        line-height: 1;
        transition: color 0.2s;
    }

    .close-btn:hover {
        color: #ff0000;
    }

    /* モーダル内のコード表示エリア */
    #html-display {
        white-space: pre-wrap;
        word-break: break-all;
        font-family: monospace;
        background: #f4f4f4;
        padding: 15px;
        border: 1px solid #ddd;
        max-height: 70vh;
        overflow-y: auto;
        margin: 15px 0;
    }
</style>

</head>
<body>

<div class="editor-layout">
    <div class="editor-pane">
        <div class="toolbar">
            <span style="font-weight:bold; color:#2d5016;">📝 Markdown入力</span>
            <div>
                <button class="secondary" onclick="insertTemplate()">テンプレート挿入</button>
                <button class="secondary" onclick="clearEditor()">クリア</button>
            </div>
        </div>
        <div class="textarea-container" id="textarea-container">
            <textarea id="markdown-input" placeholder="ファイルをドラッグ＆ドロップ、またはクリックしてファイルを選択、Markdownをペースト..."></textarea>
            <div class="drop-zone" id="drop-zone">
                <div class="drop-zone-content">
                    <div class="drop-zone-icon">📤</div>
                    <div class="drop-zone-text">ファイルをドロップしてください</div>
                    <div class="drop-zone-hint">または、クリックして選択</div>
                </div>
            </div>
        </div>
        <div class="file-info" id="file-info">✅ <strong><span id="file-name"></span></strong> を読み込みました</div>
        <div style="margin-top:5px; font-size:0.8rem; color:#666;">
            文字数: <span id="char-count">0</span> | 行: <span id="char-info">0</span>
        </div>
    </div>

<div class="preview-pane">
        <div class="toolbar">
            <span style="font-weight:bold; color:#2d5016;">👁️ プレビュー</span>
            <div>
                <button onclick="toggleDisplayMode(this)">📄 HTML表示に切り替え</button>
                <button onclick="execCopyHTML()">📋 コピー</button>
                <button onclick="downloadHTML()">💾 保存</button>
            </div>
        </div>
<div class="preview-area">
    <div id="preview" class="container"></div>
    <pre id="html-display-area" style="display:none;"></pre>
</div>
    </div>
    
<!-- ファイル入力（隠し） -->
<input type="file" id="file-input" accept=".md,.txt,.markdown">

<script>
    const input = document.getElementById('markdown-input');
    const preview = document.getElementById('preview');
    const charCount = document.getElementById('char-count');
    const charInfo = document.getElementById('char-info');
    const htmlDisplayArea = document.getElementById('html-display-area');
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const fileInfo = document.getElementById('file-info');
    const fileName = document.getElementById('file-name');
    const textareaContainer = document.getElementById('textarea-container');

    const commonCSS = document.querySelector('style') ? document.querySelector('style').innerHTML : '';
    const iconMap = {
        // 播種・育苗関連
        '播種': '🌱', '発芽': '🌱', '定植': '🌱', '育苗': '🌱',
        '施薬': '💊', 
        
        // 田んぼ準備関連
        'ほ場準備': '🌱', '土づくり': '🌱', '耕うん': '🚜', '畝立て': '🚜', '作溝': '🚜',
        
        // 田植え・移植関連
        '田植': '🌱', '移植': '🌱',
        
        // 生育ステージ
        '葉期': '🍃', '展葉': '🌿', '分げつ': '🌿', '最高': '🌿',
        '活着': '🌱', '幼穂形成': '🌾', '出穂': '🌾',
        '絹糸': '🌾', '登熟': '🌾', '成熟': '🌾',
        '水熟': '💧', '乳熟': '🥛', '糊熟': '🥛',
        '黄熟': '🟡', '完熟': '✅', '開花': '🌷',
        
        // 施肥関連
        '基肥': '🧪', '追肥': '🧪', '施肥': '🧪',
        
        // 水管理関連
        '中干し': '🌊', '落水': '💧',
        
        // 除草・防除関連
        '除草': '🚫',
        '害虫': '🐛', '防除': '🐛',
        
        // その他
        '鳥獣': '🚫', '獣害': '🚫',
        '収穫': '✂️', '倒伏': '⚠️', '見回り': '🔍', '出荷': '📦'
    };

    // キーを長い順にソート（共通で使用するためここで定義）
    const sortedKeys = Object.keys(iconMap).sort((a, b) => b.length - a.length);

    // 1. ファイル読み込み関数
    function readMarkdownFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            input.value = e.target.result;
            fileName.textContent = file.name;
            fileInfo.classList.add('show');
            updatePreview();
        };
        reader.readAsText(file);
    }

    // --- 2. 修正：ダブルクリックイベント ---
    textareaContainer.addEventListener('dblclick', (e) => {
        e.stopPropagation(); 
        console.log("File open triggered");
        fileInput.click();
    });

    fileInput.onchange = (e) => {
        if (e.target.files && e.target.files[0]) {
            readMarkdownFile(e.target.files[0]);
        }
        e.target.value = '';
    };


// --- 3. プレビュー更新ロジック ---
function updatePreview() {
    let markdown = input.value;
    if (!markdown.trim()) { 
        preview.innerHTML = ''; 
        if(htmlDisplayArea) htmlDisplayArea.textContent = '';
        return; 
    }

    // --- A. 置換用ボタンHTMLの定義（指示通りのデザインに統一） ---
    // 除草剤：白背景、角丸8px
    const herbicideBtn = `<div style="margin-top: 15px; text-align: right;">
        <a href="javascript:void(0)" onclick="openVirtualTab(herbicideData)" 
           style="display: inline-block; padding: 10px 20px; background-color: #fff; color: #2e7d32; text-decoration: none; border: 2px solid #2e7d32; border-radius: 8px; font-weight: bold;">
           🧮 除草剤希釈計算ツール（別タブ）
        </a>
    </div>`;
    
    // 害虫防除：薄緑背景、角丸12px、フォント16px
    const insecticideBtn = `<div style="margin-top: 20px; text-align: right;">
        <a href="javascript:void(0)" onclick="openVirtualTab(insecticideData)" 
           style="display: inline-block; padding: 10px 20px; background-color: #f1f8f1; color: #2e7d32; text-decoration: none; border: 2px solid #2e7d32; border-radius: 12px; font-weight: bold; font-size: 16px;">
           🧮 害虫防除農薬希釈計算（別タブで開く）
        </a>
    </div>`;

    // B. Markdownを解析（HTML化）
    let html = marked.parse(markdown);

    // C. [除草剤ボタン] [害虫防除ボタン] をHTMLに置換
    // エンジンが作る <p> タグを含めて、正規表現で確実にボタンへ差し替えます
    html = html.replace(/<p>\s*\[除草剤ボタン\]\s*<\/p>/g, herbicideBtn);
    html = html.replace(/\[除草剤ボタン\]/g, herbicideBtn);
    
    html = html.replace(/<p>\s*\[害虫防除ボタン\]\s*<\/p>/g, insecticideBtn);
    html = html.replace(/\[害虫防除ボタン\]/g, insecticideBtn);

    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;

    // --- ブラウザのタイトルを更新 ---
    const pageTitle = tempDiv.querySelector('h1, h2')?.textContent.trim() || '栽培こよみ';
    document.title = pageTitle;

    const sections = [];

    // --- h3 (詳細見出し) の処理 ---
    tempDiv.querySelectorAll('h3').forEach(h3 => {
        const rawTitle = h3.textContent;
        let displayTitle = rawTitle;

        sortedKeys.forEach(key => {
            if (displayTitle.includes(key)) {
                const icon = iconMap[key];
                displayTitle = displayTitle.split(key).join(`${icon} ${key}`);
            }
        });

        const cleanKey = rawTitle.replace(/[^\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/g, '').trim();
        const id = 'ref_' + Math.random().toString(36).substr(2, 9);
        const detailBox = document.createElement('div');
        detailBox.className = 'detail-box';
        detailBox.id = id;
        
        h3.innerHTML = `<span>${displayTitle}</span><button class="back-button" onclick="backToTable()">← 戻る</button>`;
        h3.style.display = 'flex';
        h3.style.justifyContent = 'space-between';
        h3.style.alignItems = 'center';
        h3.parentNode.insertBefore(detailBox, h3);
        detailBox.appendChild(h3);
        let next = detailBox.nextSibling;
        while (next && next.tagName !== 'H3' && !next.classList?.contains('detail-box')) {
            let temp = next.nextSibling;
            detailBox.appendChild(next);
            next = temp;
        }
        sections.push({ key: cleanKey, id: id });
    });

    // --- td (テーブルセル) の処理 ---
    tempDiv.querySelectorAll('td').forEach(td => {
        let cellHtml = td.innerHTML;
        sortedKeys.forEach(key => {
            const icon = iconMap[key];
            if (cellHtml.includes(key)) {
                const target = sections.find(s => s.key.includes(key) || key.includes(s.key));
                if (target) {
                    const clickable = `<span class="stage-box stage-mark clickable-item" onclick="scrollToDetail('${target.id}')">${icon} ${key}</span>`;
                    cellHtml = cellHtml.split(key).join(clickable);
                } else {
                    cellHtml = cellHtml.split(key).join(`${icon} ${key}`);
                }
            }
        });
        td.innerHTML = cellHtml;
    });

    const finalHtml = tempDiv.innerHTML.replace(/<table>/g, '<div class="table-wrapper"><table>').replace(/<\/table>/g, '</table></div>');
    
    // DOMPurifyの設定
    const sanitized = DOMPurify.sanitize(`<div class="content-body">${finalHtml}</div>`, {
        ADD_ATTR: ['onclick', 'style', 'id', 'class', 'target'],
        ADD_TAGS: ['span', 'div', 'button', 'table', 'tbody', 'thead', 'h3', 'h4', 'a'],
        FORCE_BODY: true
    });

    preview.innerHTML = sanitized;
    if (htmlDisplayArea) htmlDisplayArea.textContent = sanitized;

    charCount.textContent = markdown.length;
    charInfo.textContent = markdown.split('\n').length;
}

// --- 4. トグル表示 ---
let isHtmlMode = false;
function toggleDisplayMode(btn) {
    isHtmlMode = !isHtmlMode;
    if (isHtmlMode) {
        preview.style.display = 'none';
        htmlDisplayArea.style.display = 'block';
        btn.textContent = '👁️ プレビュー表示に戻す';
        btn.style.backgroundColor = '#ff9800';
    } else {
        preview.style.display = 'block';
        htmlDisplayArea.style.display = 'none';
        btn.textContent = '📄 HTML表示に切り替え';
        btn.style.backgroundColor = ''; 
    }
}

// 補助関数：プレビュー内容からタイトルを動的に取得する
function getDynamicTitle() {
    const firstHeading = preview.querySelector('h1, h2, h3');
    return firstHeading ? firstHeading.textContent.trim() : '栽培こよみ';
}

// --- 5. コピー・保存（構文エラー回避版） ---
function execCopyHTML() {
    const content = preview.innerHTML;
    const pageTitle = getDynamicTitle();
    
    // 書き出し後のHTMLに持たせる動作スクリプト（文字列として定義）
    const injectedScript = 
        '<script>\n' +
        '    function openVirtualTab(data) {\n' +
        '        var newWin = window.open("", "_blank");\n' +
        '        if (newWin) {\n' +
        '            newWin.document.write(data);\n' +
        '            newWin.document.close();\n' +
        '        } else {\n' +
        '            alert("ポップアップがブロックされました。許可してください。");\n' +
        '        }\n' +
        '    }\n' +
        '    function scrollToDetail(id) {\n' +
        '        var el = document.getElementById(id);\n' +
        '        if (el) {\n' +
        '            el.scrollIntoView({ behavior: "instant" });\n' +
        '            location.hash = id;\n' +
        '        }\n' +
        '    }\n' +
        '    function backToTable() {\n' +
        '        window.scrollTo(0, 0);\n' +
        '        if (history.replaceState) {\n' +
        '            history.replaceState(null, null, window.location.pathname);\n' +
        '        }\n' +
        '    }\n' +
        '</' + 'script>';

// 全体の構造を組み立て（ヘッダーとスクリプト、メインコンテンツのみを連結）
    const fullHTML = 
        '<!DOCTYPE html>\n' +
        '<html lang="ja">\n' +
        '<head>\n' +
        '    <meta charset="UTF-8">\n' +
        '    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
        '    <title>' + pageTitle + '</title>\n' +
        '    ' + injectedScript + '\n' +
        '</head>\n' +
        '<body>\n' +
        '    <div class="container">\n' +
        '        ' + content + '\n' +
        '    </div>\n'; 
        // 閉じタグは content 側に含まれる、または後続処理で付与されるためここで終了

    // クリップボードへコピー
    navigator.clipboard.writeText(fullHTML).then(function() {
        alert('✅ 完全に動作するHTMLをコピーしました！');
    }).catch(function(err) {
        console.error('Copy failed', err);
        alert('コピーに失敗しました');
    });
}
// プレビューの更新を監視
input.addEventListener('input', updatePreview);

// テンプレート挿入用関数（修正版）
function insertTemplate() {
    input.value = `# 令和８年産 栽培こよみ\n\n[除草剤ボタン]\n\n## 栽培管理表\n\n[害虫防除ボタン]\n\n...`;
    updatePreview();
}

function clearEditor() {
    if(confirm('入力をすべて消去しますか？')) {
        input.value = '';
        updatePreview();
    }
}

</script>
</body>
</html>
