<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栽培こよみエディタ（修正版）</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f5f5;
        padding: 10px;
    }
    .container {
        max-width: 1400px;
        margin: 0 auto;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        padding: 20px;
    }
    h1 {
        text-align: center;
        color: #2d5016;
        margin-bottom: 5px;
        font-size: 2.2rem;
    }
    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 10px;
        font-size: 1.2rem;
    }
    .date-info {
        text-align: center;
        color: #999;
        margin-bottom: 25px;
        font-size: 1rem;
    }
    h2 {
        color: #2d5016;
        margin-top: 30px;
        margin-bottom: 15px;
        font-size: 1.5rem;
        border-bottom: 3px solid #2d5016;
        padding-bottom: 10px;
    }
    h3 {
        color: #2d5016;
        margin-top: 20px;
        margin-bottom: 12px;
        font-size: 1.2rem;
        border-left: 4px solid #2d5016;
        padding-left: 10px;
    }
    .table-wrapper {
        position: relative;
        overflow-x: auto;
        border: 1px solid #ddd;
        border-radius: 5px;
        margin-bottom: 20px;
        width: 100%;
    }
    table {
        width: 100%;
        min-width: 600px;
        border-collapse: collapse;
        background: white;
        table-layout: auto;
    }
    thead {
        background: #2d5016;
        position: sticky;
        top: 0;
        z-index: 10;
    }
    th {
        background: #2d5016;
        color: white;
        padding: 16px 12px;
        text-align: center;
        font-weight: bold;
        font-size: 1.05rem;
        border: 1px solid #1a3a0d;
        white-space: nowrap;
    }
    td {
        padding: 16px 12px;
        border: 1px solid #ddd;
        font-size: 1rem;
        text-align: center;
        line-height: 1.6;
        min-height: 60px;
        vertical-align: middle;
        word-wrap: break-word;
    }
    tbody tr:nth-child(odd) td {
        background: #fafafa;
    }
    tbody tr:hover td {
        background: #f0f8ff;
    }
    .row-label {
        background: #e8f5e9;
        font-weight: bold;
        color: #2d5016;
        text-align: center;
        position: sticky;
        left: 0;
        z-index: 5;
        border: 1px solid #ddd;
    }
    .stage-box {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 0.95rem;
        font-weight: 500;
        margin: 2px;
    }
    .stage-seed { background: #ffe0b2; color: #333; }
    .stage-growth { background: #c8e6c9; color: #333; }
    .stage-mature { background: #81c784; color: white; }
    .stage-harvest { background: #8b7355; color: white; }
    .stage-water { background: #81d4fa; color: #333; }
    .stage-mark { background: #fff9c4; color: #333; padding: 2px 4px; font-weight: bold; cursor: pointer; }

    .detail-box {
        background: #f0f8ff;
        border: 2px solid #2d5016;
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
        display: block;
        scroll-margin-top: 20px;
    }
    .detail-box h4 {
        color: #2d5016;
        font-size: 1.3rem;
        margin-bottom: 15px;
        border-bottom: 2px solid #2d5016;
        padding-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }
    .detail-box ul {
        margin-left: 20px;
        line-height: 2;
        font-size: 1.05rem;
        color: #333;
        list-style-type: disc;
    }
    .back-button {
        display: inline-block;
        padding: 10px 18px;
        background: #666;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: bold;
        transition: background 0.3s;
    }
    .back-button:hover { background: #444; }

    /* ========== エディタレイアウト ========== */
    .editor-layout { display: flex; gap: 20px; width: 100%; min-height: 95vh; }
    .editor-pane, .preview-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    
    .textarea-container {
        position: relative;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }

    textarea {
        width: 100%;
        flex-grow: 1;
        padding: 15px;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        border: 2px solid #ddd;
        border-radius: 8px;
        resize: none;
        background: white;
        color: #333;
        transition: all 0.3s;
    }

    textarea:hover {
        border-color: #2d5016;
        background-color: #fafafa;
    }

    textarea:focus {
        outline: none;
        border-color: #2d5016;
        background-color: #f0f8ff;
    }

    /* ========== ドラッグドロップオーバーレイ（GitHub風） ========== */
    .drop-zone {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(45, 80, 22, 0.05);
        border: 2px dashed #2d5016;
        border-radius: 8px;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 100;
        backdrop-filter: blur(0px);
        transition: all 0.3s;
    }

    .drop-zone.active {
        display: flex;
        background: rgba(45, 80, 22, 0.15);
        border-color: #2d5016;
        backdrop-filter: blur(2px);
    }

    .drop-zone-content {
        text-align: center;
        pointer-events: none;
    }

    .drop-zone-icon {
        font-size: 3rem;
        margin-bottom: 10px;
    }

    .drop-zone-text {
        font-size: 1.1rem;
        font-weight: bold;
        color: #2d5016;
        margin-bottom: 5px;
    }

    .drop-zone-hint {
        font-size: 0.9rem;
        color: #666;
    }

    .preview-area {
        flex-grow: 1;
        overflow-y: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }
    .toolbar {
        padding: 10px 0;
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
    }
    button {
        padding: 10px 20px;
        cursor: pointer;
        background: #2d5016;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        font-size: 1rem;
        transition: background 0.3s;
    }
    button:hover { background: #1a3a0d; }
    button.secondary {
        background: #666;
        font-size: 0.9rem;
        padding: 8px 16px;
    }
    button.secondary:hover { background: #444; }
    #preview { margin: 0; background: white; }

    /* ========== HTMLモーダル ========== */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
        background-color: white;
        margin: 5% auto;
        padding: 20px;
        border-radius: 8px;
        width: 80%;
        max-height: 80vh;
        overflow-y: auto;
    }
    .modal-close {
        position: absolute;
        right: 15px;
        top: 10px;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        color: #999;
    }
    .modal-close:hover { color: #333; }
    #html-display {
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 15px;
        font-family: monospace;
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 60vh;
        overflow-y: auto;
    }

    /* ========== ファイル入力（隠す） ========== */
    #file-input {
        display: none;
    }

    .file-info {
        margin-top: 8px;
        font-size: 0.85rem;
        color: #666;
        padding: 8px 12px;
        background: #e8f5e9;
        border-radius: 4px;
        display: none;
        border-left: 4px solid #2d5016;
    }

    .file-info.show {
        display: block;
    }

    .file-info strong {
        color: #2d5016;
    }
</style>
</head>
<body>

<div class="editor-layout">
    <div class="editor-pane">
        <div class="toolbar">
            <span style="font-weight:bold; color:#2d5016;">📝 Markdown入力</span>
            <div>
                <button class="secondary" onclick="insertTemplate()">テンプレート挿入</button>
                <button class="secondary" onclick="clearEditor()">クリア</button>
            </div>
        </div>
        <div class="textarea-container" id="textarea-container">
            <textarea id="markdown-input" placeholder="ファイルをドラッグ＆ドロップ、またはクリックしてファイルを選択、Markdownをペースト..."></textarea>
            <div class="drop-zone" id="drop-zone">
                <div class="drop-zone-content">
                    <div class="drop-zone-icon">📤</div>
                    <div class="drop-zone-text">ファイルをドロップしてください</div>
                    <div class="drop-zone-hint">または、クリックして選択</div>
                </div>
            </div>
        </div>
        <div class="file-info" id="file-info">✅ <strong><span id="file-name"></span></strong> を読み込みました</div>
        <div style="margin-top:5px; font-size:0.8rem; color:#666;">
            文字数: <span id="char-count">0</span> | 行: <span id="char-info">0</span>
        </div>
    </div>

    <div class="preview-pane">
        <div class="toolbar">
            <span style="font-weight:bold; color:#2d5016;">👁️ プレビュー</span>
            <div>
                <button onclick="showHTML()">📄 HTML表示</button>
                <button onclick="execCopyHTML()">📋 コピー</button>
                <button onclick="downloadHTML()">💾 保存</button>
            </div>
        </div>
        <div class="preview-area">
            <div id="preview" class="container"></div>
        </div>
    </div>
</div>

<!-- HTMLモーダル -->
<div id="htmlModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeHTML()">&times;</span>
        <h2>生成されたHTML</h2>
        <div id="html-display"></div>
    </div>
</div>

<!-- ファイル入力（隠し） -->
<input type="file" id="file-input" accept=".md,.txt,.markdown">

<script>
    const input = document.getElementById('markdown-input');
    const preview = document.getElementById('preview');
    const charCount = document.getElementById('char-count');
    const charInfo = document.getElementById('char-info');
    const htmlModal = document.getElementById('htmlModal');
    const htmlDisplay = document.getElementById('html-display');
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const fileInfo = document.getElementById('file-info');
    const fileName = document.getElementById('file-name');
    const textareaContainer = document.getElementById('textarea-container');

    const commonCSS = document.querySelector('style') ? document.querySelector('style').innerHTML : '';

    window.scrollToDetail = (id) => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
    };

    window.backToTable = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    // ========== ファイル入力 ==========
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            readMarkdownFile(file);
        }
    });

    // ========== テキストエリアクリックでファイル選択 ==========
    input.addEventListener('click', (e) => {
        // テキストがない場合のみファイル選択を開く
        if (input.value.trim() === '') {
            fileInput.click();
        }
    });

    // ========== ドラッグドロップ処理 ==========
    textareaContainer.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('active');
    });

    textareaContainer.addEventListener('dragleave', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.target === textareaContainer) {
            dropZone.classList.remove('active');
        }
    });

    textareaContainer.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('active');

        const files = e.dataTransfer.files;
        if (files.length > 0) {
            const file = files[0];
            // MDファイルかテキストファイルをチェック
            if (file.type === 'text/plain' || file.type === 'text/markdown' || 
                file.name.endsWith('.md') || file.name.endsWith('.markdown') || file.name.endsWith('.txt')) {
                readMarkdownFile(file);
            } else {
                alert('❌ Markdownファイル（.md, .txt）をドロップしてください');
            }
        }
    });

    function readMarkdownFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            input.value = e.target.result;
            fileName.textContent = file.name;
            fileInfo.classList.add('show');
            updatePreview();
        };
        reader.onerror = () => {
            alert('❌ ファイルの読み込みに失敗しました');
        };
        reader.readAsText(file);
    }

    // ========== プレビュー表示 ==========
    function showHTML() {
        htmlDisplay.textContent = preview.innerHTML;
        htmlModal.style.display = 'block';
    }

    function closeHTML() {
        htmlModal.style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target === htmlModal) htmlModal.style.display = 'none';
    };

    function updatePreview() {
        let markdown = input.value;
        if (!markdown.trim()) {
            preview.innerHTML = '';
            return;
        }

        let html = marked.parse(markdown);

        // リンク処理
        html = html.replace(/<a\s+href="([^"]+)">([\s\S]*?)<\/a>/g, (match, href, text) => {
            return `<span class="stage-box stage-mark" onclick="scrollToDetail('${href}');">${text}</span>`;
        });

        // 詳細セクション処理
        html = html.replace(/<h3>(.*?)<\/h3>/g, (match, title) => {
            const id = title.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
            return `</div><div class="detail-box" id="${id}"><h4><span>${title}</span><button class="back-button" onclick="backToTable()">← 戻る</button></h4>`;
        });

        // テーブルをラップ
        html = html.replace(/<table>/g, '<div class="table-wrapper"><table>');
        html = html.replace(/<\/table>/g, '</table></div>');

        let finalHtml = `<div class="content-body">${html}</div>`;

        const clean = DOMPurify.sanitize(finalHtml, {
            ADD_ATTR: ['onclick', 'style', 'rowspan', 'colspan', 'id'],
            ADD_TAGS: ['span', 'div', 'button', 'table', 'tbody', 'thead'],
            FORCE_BODY: true
        });

        preview.innerHTML = clean;

        charCount.textContent = markdown.length;
        charInfo.textContent = markdown.split('\n').length;
    }

    function execCopyHTML() {
        navigator.clipboard.writeText(preview.innerHTML).then(() => {
            alert('✅ HTMLをコピーしました！');
        });
    }

    function downloadHTML() {
        const content = preview.innerHTML;
        const finalFile = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栽培こよみ</title>
<style>${commonCSS}</style>
</head>
<body>
<div class="container">${content}</div>
<script>
function scrollToDetail(id){ document.getElementById(id).scrollIntoView({behavior:'smooth'}); }
function backToTable(){ window.scrollTo({top:0,behavior:'smooth'}); }
<\/script>
</body>
</html>`;
        const blob = new Blob([finalFile], { type: 'text/html; charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'cultivation_sheet.html';
        a.click();
    }

    function insertTemplate() {
        input.value = `## 📊 栽培スケジュール

| 月 | 旬 | 生育ステージ | 主な作業 |
|:---:|:---:|:---:|:---|
| 4月 | 上旬 | [播種](seedDetail) | ほ場準備 |
| | | 播種 | 播種 |
| | 上旬 | | — |
| 5月 | | | |
| | 上旬 | | |

---

### 播種について (id="seedDetail")
- 種子を選定する
- ほ場を準備する
- 適温で播種する`;
        updatePreview();
    }

    function clearEditor() {
        if (confirm("すべて消去しますか？")) {
            input.value = "";
            fileInfo.classList.remove('show');
            updatePreview();
        }
    }

    input.addEventListener('input', updatePreview);
    updatePreview();
</script>

</body>
</html>
